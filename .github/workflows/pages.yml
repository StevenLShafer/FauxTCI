# Deploy the static page to GitHub Pages on every push to main.
# One-time setup in the repository: Settings, Pages, Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site is the page and what it loads: index.html, css/, js/ and
      # the licence.  Tests, fixtures and the workflows stay out of it.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html LICENSE README.md _site/
          cp -r css js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
